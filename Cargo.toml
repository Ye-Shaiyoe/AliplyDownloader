[package]
name = "aliply-downloader"
version = "0.1.0"
edition = "2021"
description = "A cross-platform CLI video downloader"
license = "MIT"

[[bin]]
name = "aliply-downloader"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
